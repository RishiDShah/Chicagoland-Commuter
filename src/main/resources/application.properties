spring.application.name=chicagoland-commuter

# Keep the database running between app restarts (faster), stop it with: docker compose down
spring.docker.compose.lifecycle-management=start-only

management.endpoints.web.exposure.include=health,info

# Opens the browser automatically in development
vaadin.launch-browser=true

# --- Transit schedules (GTFS) ---
commuter.gtfs.import-on-startup=true
commuter.gtfs.cache-dir=${user.home}/.chicagoland-commuter/gtfs
# Every Monday at 4:00 AM Chicago time
commuter.gtfs.refresh-cron=0 0 4 * * MON

commuter.gtfs.feeds[0].id=cta
commuter.gtfs.feeds[0].name=CTA
commuter.gtfs.feeds[0].url=https://www.transitchicago.com/downloads/sch_data/google_transit.zip

commuter.gtfs.feeds[1].id=metra
commuter.gtfs.feeds[1].name=Metra
commuter.gtfs.feeds[1].url=https://schedules.metrarail.com/gtfs/schedule.zip

# Pace changes its download link every month, so the link is read from this page
commuter.gtfs.feeds[2].id=pace
commuter.gtfs.feeds[2].name=Pace
commuter.gtfs.feeds[2].page-url=https://www.pacebus.com/route-timetable-data-services
commuter.gtfs.feeds[2].link-pattern=href="([^"]*GTFS[^"]*\\.zip)"
